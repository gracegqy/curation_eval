[project]
name = "curation-eval"
version = "0.1.0"
description = "An Inspect eval reproducing a real LLM-curation preference-adherence experiment, with uncertainty."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "inspect-ai>=0.3.100",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["curation_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
